<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>物联网学科大模型教学实验平台</title>
    <script>
      /* 主题必须在样式生效前落定，否则暗色用户会看到一帧白屏。
         脚本内联在这里，跑在 CSS 与 Vue 之前；逻辑与 utils/theme.ts 保持一致。 */
      (function () {
        try {
          var saved = localStorage.getItem('iot-edu-theme')
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch (e) {
          /* localStorage 不可用时按亮色渲染即可 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
